name: Build Windows EXE and MSI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x86"
      - run: pip install -r requirements.txt
      - name: Make logo and icon
        run: python make_assets.py
      - name: Build app (folder)
        run: pyinstaller --onedir --windowed --noupx --icon assets/icon.ico --add-data "assets/logo_full.png;assets" --add-data "assets/logo_mark.png;assets" --add-data "assets/icon.ico;assets" --name "KavasuDynoPOSB Calcy" src/main.py
      - name: Build debug version (shows errors)
        run: pyinstaller --onedir --console --noupx --icon assets/icon.ico --add-data "assets/logo_full.png;assets" --add-data "assets/logo_mark.png;assets" --add-data "assets/icon.ico;assets" --name KavasuDebug src/main.py
      - name: Zip portable versions
        run: |
          Compress-Archive -Path "dist/KavasuDynoPOSB Calcy" -DestinationPath KavasuDynoPOSB-Calcy-Portable.zip
          Compress-Archive -Path "dist/KavasuDebug" -DestinationPath KavasuDebug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Portable
          path: |
            KavasuDynoPOSB-Calcy-Portable.zip
            KavasuDebug.zip
      - name: Build MSI installer
        run: |
          $ver = "1.0.0"
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)') { $ver = $Matches[1] }
          python make_wxs.py "dist\KavasuDynoPOSB Calcy" "KavasuDynoPOSB Calcy.exe" $ver
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          wix build installer.wxs -arch x86 -sval -o KavasuDynoPOSB-Calcy-Setup.msi
      - uses: actions/upload-artifact@v4
        with:
          name: Installer-MSI
          path: KavasuDynoPOSB-Calcy-Setup.msi
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KavasuDynoPOSB-Calcy-Setup.msi
            KavasuDynoPOSB-Calcy-Portable.zip
            KavasuDebug.zip
